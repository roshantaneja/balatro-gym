[project]
name = "balatro-gym"
version = "0.1.0"
description = "Pure-Python Balatro reimplementation with a Gymnasium RL environment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
env = ["gymnasium>=1.0", "numpy>=1.26"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "gymnasium>=1.0",
    "numpy>=1.26",
]
train = [
    "sb3-contrib>=2.4",
    "stable-baselines3>=2.4",
    "torch",
    "tensorboard",
    "tqdm",
    "rich",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balatro_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# engine/__init__.py re-exports the engine API (``__all__`` is built from dir()).
"src/balatro_gym/engine/__init__.py" = ["F401"]
